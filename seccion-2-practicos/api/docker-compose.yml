# Levanta la API junto con MongoDB:  docker compose up -d --build
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/tareas}
      API_TOKEN: ${API_TOKEN:?Define API_TOKEN en el archivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PUBLIC_URL: ${PUBLIC_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
